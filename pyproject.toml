[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-management-suite"
version = "0.1.0"
description = "A finance management suite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["typer>=0.27.1"]

[tool.setuptools.packages.find]
where = ['src']

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.4"]

[project.scripts]
finance = "finance_suite.cli:main"
